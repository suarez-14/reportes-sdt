<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Actividades de campo</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1a2233;--mu:#667085;--pr:#1d5fd1;--bd:#d9dfe9;--ok:#188a4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161f;--card:#1b212d;--tx:#e8ecf4;--mu:#98a2b3;--pr:#6ea0ff;--bd:#2c3547;--ok:#4cc27f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161f;--card:#1b212d;--tx:#e8ecf4;--mu:#98a2b3;--pr:#6ea0ff;--bd:#2c3547;--ok:#4cc27f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:38px 14px 96px}
h1{font-size:22px;margin:6px 0 14px}h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--pr);color:#fff;font-size:16px;font-weight:600;margin-top:8px;text-align:center}
.btn.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}.btn.d{background:transparent;color:#d33;border:1px solid #d33}.btn.ok{background:var(--ok)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;font-family:inherit;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
input[type=checkbox]{width:22px;height:22px;flex:none}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);margin:0;color:var(--tx);font-size:16px}
.row{display:flex;gap:10px}.row>*{flex:1}
.seg button{padding:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font-size:16px}.seg button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.th{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.th div{position:relative;width:calc(50% - 4px)}.th img{width:100%;height:110px;object-fit:cover;border-radius:8px;display:block}.th input{font-size:13px;padding:6px;margin-top:4px}.rp figure{display:inline-block;width:48%;margin:1%;vertical-align:top;break-inside:avoid}.rp figure img{width:100%;margin:0}.rp figcaption{font-size:11px}.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rp .cc{break-inside:avoid}.rp .cc figure{display:block;width:100%;margin:0 0 6px}.rp .cc h4{margin:4px 0}@media screen and (max-width:600px){.cg{grid-template-columns:repeat(2,1fr)}.pg{grid-template-columns:repeat(2,1fr)}}.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rp .pg figure{display:block;width:100%;margin:0;break-inside:avoid}.rp .ib{aspect-ratio:1/1;background:#f1f3f6;border:1px solid #cfd4dc;display:flex;align-items:center;justify-content:center;overflow:hidden}.rp .pg img{width:100%!important;height:100%;object-fit:contain;margin:0!important;border-radius:0}.rp .pg figcaption{font-size:10px;margin-top:2px}.pr{display:flex;gap:8px;margin-bottom:8px;break-inside:avoid;page-break-inside:avoid}.rp .pr figure{flex:0 0 calc((100% - 16px)/3);max-width:calc((100% - 16px)/3);margin:0;display:block}.rp .pr img{width:100%!important;height:100%;object-fit:contain;margin:0!important;border-radius:0}.rp .pr figcaption{font-size:10px;margin-top:2px}.rp tr,.rp .sig td,.rp .sig,.rp .kv{break-inside:avoid}.bar{break-after:avoid;page-break-after:avoid}@media screen and (max-width:600px){.pr{flex-wrap:wrap}.rp .pr figure{flex-basis:calc(50% - 4px);max-width:calc(50% - 4px)}}
.th b{position:absolute;top:-6px;right:-6px;background:#d33;color:#fff;width:22px;height:22px;border-radius:50%;text-align:center;font-size:14px;line-height:22px}
.add{display:inline-block;padding:10px 14px;border:1px dashed var(--pr);color:var(--pr);border-radius:10px;font-size:15px;margin:0}
.add input{display:none}
.mu{color:var(--mu);font-size:14px}.tag{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--bd);color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:10px 2px;border:0;background:none;color:var(--mu);font-size:12px}nav button.on{color:var(--pr);font-weight:700}nav span{display:block;font-size:20px}
.big{font-size:32px;font-weight:700}
.rp{background:#fff;color:#111;padding:12px;border-radius:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.rp h4{margin:8px 0 2px}.rp img{width:48%;margin:1%;border-radius:6px}.rp table{border-collapse:collapse;width:100%;margin-bottom:6px}.rp td,.rp th{padding:6px;border:1px solid #bbb;font-size:13px;text-align:left}.rp th{background:#e6ebf3}.kv th{width:34%}.kv td{white-space:pre-wrap}.rp p{font-size:13px;margin:4px 0}.hd{display:flex;gap:10px;align-items:center;border-bottom:2px solid #1d5fd1;padding-bottom:8px;margin-bottom:8px;font-size:12px}.hd img{width:42%!important;margin:0!important;border-radius:0!important}.bar{background:#1f3a7a;color:#fff;font-weight:700;font-size:13px;padding:6px 8px;margin:10px 0 4px;text-align:center}.eq{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px}.toast{position:fixed;left:16px;right:16px;bottom:90px;background:#222;color:#fff;padding:12px;border-radius:10px;text-align:center;z-index:9}
.stars button{background:none;border:0;font-size:34px;color:var(--bd);padding:0 4px}.stars .on{color:#f5a623}.sg canvas{width:100%;height:160px;border:1px solid var(--bd);border-radius:10px;background:#fff;touch-action:none;display:block}.sig td{width:33%;vertical-align:top}@page{margin:12mm 10mm 24mm;@bottom-center{content:"SDT Ingeniería · Página " counter(page) " de " counter(pages);font-size:9pt}}
#net{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:10px;z-index:8;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--tx)}#net i{width:9px;height:9px;border-radius:50%;background:#188a4a}#net.off{color:#d33;border-color:#d33}#net.off i{background:#d33}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.pill{cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border:1px solid var(--bd);border-radius:99px;background:var(--card);font-size:13px;color:var(--tx)}.pill b{min-width:24px;height:24px;padding:0 6px;border-radius:99px;color:#fff;font-size:13px;line-height:24px;text-align:center}
@media print{nav,.np,#net{display:none!important}body{background:#fff;color:#000}#app{padding:0}}
</style></head><body><div id="app"></div><div id="net"></div>
<nav><button data-v="home"><span>🏠</span>Inicio</button><button data-v="tix"><span>🎫</span>Tickets</button><button data-v="new"><span>➕</span>Nueva</button><button data-v="pend"><span>📂</span>Pendientes</button><button data-v="done"><span>📄</span>Informes</button></nav>

:root{--navy:#0b1f33;--blue:#1267a5;--cyan:#12a8c9;--bg:#f3f6f9;--card:#fff;--line:#d9e2ea;--text:#1d2b36;--muted:#687783;--danger:#b42318;--dangerbg:#fff0ee;--ok:#087443}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.45}
.app{max-width:1100px;margin:auto;padding:18px 14px 42px}.topbar{position:relative;overflow:hidden;background:linear-gradient(135deg,#0b1f33 0%,#10426b 55%,#1267a5 100%);color:white;border-radius:18px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 10px 30px #0b1f3320;margin-bottom:16px}.brand{display:flex;align-items:center;gap:14px}.logo{width:208px;flex:none;line-height:0}.logo svg{width:100%;height:auto;display:block}.brand>div:nth-child(2){border-left:1px solid #ffffff38;padding-left:18px}.topbar h1{font-size:21px;margin:0}.topbar p{margin:3px 0 0;color:#cfe0ed;font-size:13px}.topbar::after{content:"";position:absolute;right:-34px;top:-44px;width:150px;height:150px;border:16px solid #ffffff10;border-radius:34px;transform:rotate(18deg);pointer-events:none}.status{position:relative;z-index:1;font-size:12px;background:#ffffff12;border:1px solid #ffffff22;padding:7px 10px;border-radius:999px;white-space:nowrap}
.progress{position:sticky;top:8px;z-index:5;background:#ffffffee;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:14px;display:flex;gap:8px;overflow:auto}.progress span{font-size:12px;white-space:nowrap;padding:6px 10px;border-radius:8px;color:var(--muted)}.progress span.active{background:#e8f4fb;color:var(--blue);font-weight:700}
fieldset{border:1px solid var(--line);background:var(--card);border-radius:16px;margin:0 0 15px;padding:20px;box-shadow:0 4px 16px #102a3d0a}legend{font-size:16px;font-weight:800;color:var(--navy);padding:0 9px}
.form-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.form-row:has(#tecnicoSelect){grid-template-columns:2fr 1fr}.form-row:has(#estadoSalud){grid-template-columns:1fr 1fr}.form-group{margin-bottom:14px}.form-group:last-child{margin-bottom:0}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px;color:#314553}
input,select,textarea{width:100%;border:1px solid #cbd7e0;border-radius:10px;background:#fff;color:var(--text);padding:11px 12px;font:inherit;min-height:44px;outline:none;transition:.15s}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1267a514}input[readonly]{background:#f5f7f9;color:#5f6e78}textarea{min-height:115px;resize:vertical}.dynamic-section{display:none;background:#f8fafc;border:1px dashed #cbd8e2;border-radius:12px;padding:14px;margin:5px 0 14px}.dynamic-section .form-row{grid-template-columns:repeat(3,1fr)}
.alert-danger{display:none;background:var(--dangerbg);border:1px solid #f1aaa3;color:var(--danger);font-weight:700;padding:12px;border-radius:10px;margin-top:4px}.alert-danger.show{display:block}
table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left}th{background:#eef4f8;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#4c5d68}tr:last-child td{border-bottom:0}.radio-cell{text-align:center;width:70px}input[type=radio]{width:20px;height:20px;min-height:auto;accent-color:var(--blue);cursor:pointer}
.signature-container{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafcfd}.signature-pad{display:block;width:100%;height:190px;background:white;border:2px dashed #c6d4de;border-radius:10px;touch-action:none;cursor:crosshair}.btn-clear{margin-top:8px;border:1px solid #ccd7df;background:white;color:#44535e;border-radius:8px;padding:8px 11px;cursor:pointer}
.btn-container{display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:10px;z-index:4}.btn-submit{border:0;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:white;font-weight:800;font-size:15px;padding:13px 20px;cursor:pointer;box-shadow:0 8px 20px #1267a530}.btn-secondary{border:1px solid var(--line);background:white;color:var(--text);border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin-top:5px}.required-note{font-size:12px;color:var(--muted);margin:0 0 10px}

" stroke-linecap="butt" stroke-linejoin="miter"><g clip-path="url(#lc0)"><path d="M45.75 247V279"/></g><g clip-path="url(#lc1)"><path d="M81.08333333333333 279V247L107.58333333333333 279V247" stroke-linejoin="miter"/></g><g clip-path="url(#lc2)"><path d="M170.16666666666666 250.75H143.16666666666666V275.25H170.16666666666666V263.0H157.16666666666666"/></g><g clip-path="url(#lc3)"><path d="M231.5 250.75H205.25V275.25H231.5M205.25 263.0H227.5"/></g><g clip-path="url(#lc4)"><path d="M264.0833333333333 279V247L290.5833333333333 279V247" stroke-linejoin="miter"/></g><g clip-path="url(#lc5)"><path d="M325.91666666666663 247V279"/></g><g clip-path="url(#lc6)"><path d="M387.49999999999994 250.75H361.24999999999994V275.25H387.49999999999994M361.24999999999994 263.0H383.49999999999994"/></g><g clip-path="url(#lc7)"><path d="M420.08333333333326 279V250.75H441.33333333333326Q447.33333333333326 250.75 447.33333333333326 257.75V260.0Q447.33333333333326 264.0 441.33333333333326 264.0H420.08333333333326M435.33333333333326 264.0L447.33333333333326 279"/></g><path d="M482.4166666666666 253V279"/><path d="M478.6666666666666 243L487.6666666666666 236" stroke-width="5.5"/><g clip-path="url(#lc9)"><path d="M516.9999999999999 279L530.9999999999999 249L544.9999999999999 279M521.9999999999999 268H539.9999999999999"/></g></g></svg></div><div><h1>Formato de Trabajo Seguro en Alturas</h1><p>SDT INGENIERÍA · Inspección pre-uso, condiciones del entorno y firmas</p></div></div><div class="status" id="saveState">Listo</div></header>
<nav class="progress" aria-label="Secciones"><span class="active">1 Información</span><span>2 Estructura</span><span>3 Equipos</span><span>4 Novedades</span><span>5 Firmas</span></nav>
<p class="required-note">Los campos marcados como obligatorios deben completarse antes de generar el PDF. El formulario guarda un borrador local en este dispositivo.</p>
<form id="sdtForm">
    <\!-- 1. Datos Generales -->
    <fieldset>
        <legend>1. Información General y Tiempos</legend>
        
        <div class="form-group">
            <label for="proyecto">Proyecto / Ubicación Exacta:</label>
            <input type="text" id="proyecto" placeholder="Ej: Juntas, Tolima - Mantenimiento F.O." required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" required>
            </div>
            <div class="form-group">
                <label for="horaInicio">Hora Inicio:</label>
                <input type="time" id="horaInicio" required>
            </div>
            <div class="form-group">
                <label for="horaFin">Hora Cierre:</label>
                <input type="time" id="horaFin" required>
            </div>
        </div>

        <\!-- Técnico Ejecutor -->
        <div class="form-row">
            <div class="form-group">
                <label for="tecnicoSelect">Técnico Ejecutor (Asciende):</label>
                <select id="tecnicoSelect" onchange="configurarTecnico()" required>
                    <option value="">-- Seleccionar --</option>
                    <option value="EDISON">Edison Javier Suárez</option>
                    <option value="FELIX">Felix Antonio Varón</option>
                </select>
            </div>
            <div class="form-group">
                <label for="ccTecnico">C.C. Técnico:</label>
                <input type="text" id="ccTecnico" placeholder="Cédula" readonly>
            </div>
        </div>

        <\!-- Salud y Clima -->
        <div class="form-row">
            <div class="form-group">
                <label for="estadoSalud">Aptitud de Salud:</label>
                <select id="estadoSalud" onchange="validarEstadoSalud()" required>
                    <option value="">-- Seleccionar --</option>
                    <option value="Bueno">Bueno - Apto para Trabajo en Altura</option>
                    <option value="Malo">Malo - Mareo / Malestar (No Apto)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="clima">Condición Clima:</label>
                <select id="clima" required>
                    <option value="">-- Seleccionar --</option>
                    <option value="Soleado">Soleado / Despejado</option>
                    <option value="Nublado">Nublado</option>
                    <option value="Lluvia ligera">Lluvia ligera</option>
                    <option value="Lluvia fuerte / Tormenta">Tormenta (Suspender labor)</option>
                    <option value="Viento fuerte">Viento fuerte</option>
                </select>
            </div>
        </div>
        <div id="alertaSalud" class="alert-danger">
            ⚠️ ATENCIÓN: Técnico no apto. Se suspende la realización de la labor en alturas.
        </div>
    </fieldset>

    <\!-- 2. Ubicación y Anclaje -->
    <fieldset>
        <legend>2. Estructura y Punto de Anclaje</legend>
        
        <div class="form-group">
            <label for="tipoEstructura">Lugar / Estructura de Trabajo:</label>
            <select id="tipoEstructura" onchange="mostrarCamposEstructura()" required>
                <option value="">-- Seleccionar --</option>
                <option value="Poste">Poste</option>
                <option value="Torre">Torre</option>
                <option value="Subterraneo">Subterráneo (Cámara / Pozo)</option>
            </select>
        </div>

        <\!-- POSTE -->
        <div id="secPoste" class="dynamic-section">
            <div class="form-row">
                <div class="form-group">
                    <label for="alturaPoste">Altura Poste:</label>
                    <select id="alturaPoste">
                        <option value="4 mts">4 Metros</option>
                        <option value="6 mts">6 Metros</option>
                        <option value="8 mts">8 Metros</option>
                        <option value="12 mts">12 Metros</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="form-group" id="divAlturaPosteOtro" style="display:none;">
                    <label for="alturaPosteOtro">Especifique Mts:</label>
                    <input type="text" id="alturaPosteOtro" placeholder="Ej: 10 mts">
                </div>
                <div class="form-group">
                    <label for="materialPoste">Material:</label>
                    <select id="materialPoste">
                        <option value="Madera">Madera</option>
                        <option value="Metalico">Metálico</option>
                        <option value="PRFV / Fibra de Vidrio">PRFV / Fibra de Vidrio</option>
                        <option value="Concreto">Concreto</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="estadoPoste">Estado:</label>
                    <select id="estadoPoste">
                        <option value="Bueno">Bueno</option>
                        <option value="Malo">Malo</option>
                    </select>
                </div>
            </div>
        </div>

        <\!-- TORRE -->
        <div id="secTorre" class="dynamic-section">
            <div class="form-row">
                <div class="form-group">
                    <label for="alturaTorre">Altura Torre:</label>
                    <select id="alturaTorre">
                        <option value="5 mts">5 Metros</option>
                        <option value="8 mts">8 Metros</option>
                        <option value="10 mts">10 Metros</option>
                        <option value="12 mts">12 Metros</option>
                        <option value="15 mts">15 Metros</option>
                        <option value="20 mts">20 Metros</option>
                        <option value="30 mts">30 Metros</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="form-group" id="divAlturaTorreOtro" style="display:none;">
                    <label for="alturaTorreOtro">Especifique Mts:</label>
                    <input type="text" id="alturaTorreOtro" placeholder="Ej: 45 mts">
                </div>
                <div class="form-group">
                    <label for="estadoTorre">Estado:</label>
                    <select id="estadoTorre">
                        <option value="Bueno">Bueno</option>
                        <option value="Malo">Malo</option>
                    </select>
                </div>
            </div>
        </div>

        <\!-- SUBTERRÁNEO -->
        <div id="secSubterraneo" class="dynamic-section">
            <div class="form-row">
                <div class="form-group">
                    <label for="tipoSubterraneo">Estructura:</label>
                    <select id="tipoSubterraneo">
                        <option value="Cámara de inspección">Cámara de inspección</option>
                        <option value="Pozo">Pozo</option>
                        <option value="Caja de paso">Caja de paso</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="profundidadSubterraneo">Profundidad (Mts):</label>
                    <input type="text" id="profundidadSubterraneo" placeholder="Ej: 1.8 mts">
                </div>
                <div class="form-group">
                    <label for="estadoSubterraneo">Estado del Entorno:</label>
                    <select id="estadoSubterraneo">
                        <option value="Bueno">Bueno (Sin gases / Estable)</option>
                        <option value="Malo">Malo (Inundación / Riesgo)</option>
                    </select>
                </div>
            </div>
        </div>

        <\!-- Desplegable Punto de Anclaje -->
        <div class="form-group" style="margin-top:8px;">
            <label for="puntoAnclajeSelect">Punto de Anclaje Utilizado:</label>
            <select id="puntoAnclajeSelect" onchange="evaluarOtroAnclaje()" required>
                <option value="">-- Seleccionar Tipo de Anclaje --</option>
                <option value="Poste (Cinta Tie-Off / Estrangulado)">Poste (Cinta Tie-Off / Estrangulado)</option>
                <option value="Estructura de Torre (Peldaño / Diagonal)">Estructura de Torre (Peldaño / Diagonal)</option>
                <option value="Línea de Vida Vertical / Cable de Acero">Línea de Vida Vertical / Cable de Acero</option>
                <option value="Cáncamo / Roseta Certificada">Cáncamo / Roseta Certificada</option>
                <option value="Otro">Otro (Especificar)</option>
            </select>
        </div>
        <div class="form-group" id="divOtroAnclaje" style="display:none;">
            <label for="otroAnclajeTexto">Especifique Punto de Anclaje:</label>
            <input type="text" id="otroAnclajeTexto" placeholder="Describa el punto de anclaje">
        </div>

        <div class="form-group">
            <label for="planRescate">Atención de Emergencia / Apoyo en Sitio:</label>
            <select id="planRescate" required>
                <option value="Comunicación vía celular y aviso inmediato a líneas de emergencia / cuadrilla">Comunicación vía celular y aviso a líneas de emergencia / cuadrilla</option>
                <option value="Descenso controlado por compañero en piso">Descenso asistido por compañero en piso</option>
            </select>
        </div>
    </fieldset>

    <\!-- 3. Chequeo de Equipos y EPP -->
    <fieldset>
        <legend>3. Inspección Pre-Uso de Equipos (EPCC y EPP)</legend>
        <table>
            <thead>
                <tr>
                    <th>Elemento a Inspeccionar</th>
                    <th>Sí</th>
                    <th>No</th>
                    <th>N/A</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1. Arnés dieléctrico (costuras, herrajes sin corrosión).</td>
                    <td class="radio-cell"><input type="radio" name="i1" value="Si" required></td>
                    <td class="radio-cell"><input type="radio" name="i1" value="No"></td>
                    <td class="radio-cell"><input type="radio" name="i1" value="NA"></td>
                </tr>
                <tr>
                    <td>2. Eslinga doble gancho en Y / Eslinga de posicionamiento.</td>
                    <td class="radio-cell"><input type="radio" name="i2" value="Si" required></td>
                    <td class="radio-cell"><input type="radio" name="i2" value="No"></td>
                    <td class="radio-cell"><input type="radio" name="i2" value="NA"></td>
                </tr>
                <tr>
                    <td>3. Casco dieléctrico con barbuquejo de 3 o 4 puntos.</td>
                    <td class="radio-cell"><input type="radio" name="i3" value="Si" required></td>
                    <td class="radio-cell"><input type="radio" name="i3" value="No"></td>
                    <td class="radio-cell"><input type="radio" name="i3" value="NA"></td>
                </tr>
                <tr>
                    <td>4. Gafas de seguridad de protección visual.</td>
                    <td class="radio-cell"><input type="radio" name="i4" value="Si" required></td>
                    <td class="radio-cell"><input type="radio" name="i4" value="No"></td>
                    <td class="radio-cell"><input type="radio" name="i4" value="NA"></td>
                </tr>
                <tr>
                    <td>5. Botas de seguridad dieléctricas.</td>
                    <td class="radio-cell"><input type="radio" name="i5" value="Si" required></td>
                    <td class="radio-cell"><input type="radio" name="i5" value="No"></td>
                    <td class="radio-cell"><input type="radio" name="i5" value="NA"></td>
                </tr>
                <tr>
                    <td>6. Guantes de seguridad / antideslizantes.</td>
                    <td class="radio-cell"><input type="radio" name="i6" value="Si" required></td>
                    <td class="radio-cell"><input type="radio" name="i6" value="No"></td>
                    <td class="radio-cell"><input type="radio" name="i6" value="NA"></td>
                </tr>
                <tr>
                    <td>7. Escalera (zapatas antiderrapantes, seguros, peldaños).</td>
                    <td class="radio-cell"><input type="radio" name="i7" value="Si" required></td>
                    <td class="radio-cell"><input type="radio" name="i7" value="No"></td>
                    <td class="radio-cell"><input type="radio" name="i7" value="NA"></td>
                </tr>
                <tr>
                    <td>8. Señalización en piso (conos, cinta de peligro).</td>
                    <td class="radio-cell"><input type="radio" name="i8" value="Si" required></td>
                    <td class="radio-cell"><input type="radio" name="i8" value="No"></td>
                    <td class="radio-cell"><input type="radio" name="i8" value="NA"></td>
                </tr>
            </tbody>
        </table>
    </fieldset>

    <\!-- 4. Novedades y Observaciones -->
    <fieldset>
        <legend>4. Novedades y Observaciones del Entorno</legend>
        <div class="form-group">
            <label for="novedadPredefinida">Seleccione una Novedad Predefinida:</label>
            <select id="novedadPredefinida" onchange="cargarNovedadTexto()">
                <option value="Ninguna. No se evidencia ninguna alteración desde nivel de piso para realizar la actividad de forma segura.">Ninguna / Trabajo Seguro Sin Riesgo Adicional</option>
                <option value="Se evidencia presencia de vegetación o ramas cerca de la red / estructura.">Presencia de vegetación o ramas en la red</option>
                <option value="Cables de energía / baja tensión cercanos a la zona de intervención.">Cables de energía / baja tensión cercanos</option>
                <option value="Terreno irregular, resbaladizo o presencia de barro en piso.">Terreno irregular / resbaladizo / barro</option>
                <option value="Tránsito vehicular frecuente cerca a la zona de trabajo.">Tránsito vehicular frecuente en sitio</option>
                <option value="OTRO">Escribir una novedad personalizada...</option>
            </select>
        </div>
        <div class="form-group">
            <label for="observaciones">Detalle de Observaciones (Texto para PDF):</label>
            <textarea id="observaciones" placeholder="Se completará según la opción elegida o puede escribir texto personalizado...">Ninguna. No se evidencia ninguna alteración desde nivel de piso para realizar la actividad de forma segura.</textarea>
        </div>
    </fieldset>

    <\!-- 5. Firmas -->
    <fieldset>
        <legend>5. Firmas de la Cuadrilla</legend>
        
        <div class="form-group signature-container">
            <label id="lblFirmaTecnico">Firma del Técnico Ejecutor (Asciende):</label>
            <canvas id="canvasTecnico" class="signature-pad"></canvas>
            <button type="button" class="btn-clear" onclick="limpiarCanvas('canvasTecnico')">Borrar Firma Ejecutor</button>
        </div>

        <div class="form-group" style="margin-top:10px;">
            <label for="apoyoNombre">Técnico de Apoyo / Acompañante en Piso:</label>
            <input type="text" id="apoyoNombre" readonly placeholder="Se selecciona automáticamente">
        </div>

        <div class="form-group signature-container">
            <label id="lblFirmaApoyo">Firma del Técnico de Apoyo (En Piso):</label>
            <canvas id="canvasApoyo" class="signature-pad"></canvas>
            <button type="button" class="btn-clear" onclick="limpiarCanvas('canvasApoyo')">Borrar Firma Apoyo</button>
        </div>
    </fieldset>

    <\!-- Botón Exportar PDF -->
    <div class="btn-container">
        <button type="button" id="btnGuardar" class="btn-submit" onclick="descargarPDF()">📥 Guardar / Imprimir PDF</button>
    </div>
</form>
<div class="btn-container"><button type="button" class="btn-secondary" onclick="clearDraft()">↺ Limpiar formulario</button><button type="button" class="btn-submit" onclick="descargarPDF()">📄 Guardar / Imprimir PDF</button></div>
<footer style="text-align:center;color:#71808b;font-size:11px;margin-top:18px">SDT INGENIERÍA · Formato digital responsive · Compatible con PC, tablet y celular</footer>
<div class="print-footer" id="printFooter"></div></main><script>
const $=id=>document.getElementById(id);
function pie(){$("printFooter").textContent="SDT INGENIERÍA · Formato de Trabajo Seguro en Alturas · Generado el "+new Date().toLocaleString("es-CO",{dateStyle:"long",timeStyle:"short"})}
window.addEventListener("beforeprint",pie);document.addEventListener("DOMContentLoaded",pie);
const tecnicos={EDISON:{cc:"1110507910",apoyo:"Felix Antonio Varón"},FELIX:{cc:"",apoyo:"Edison Javier Suárez"}};
function configurarTecnico(){const v=$("tecnicoSelect").value,t=tecnicos[v];const cc=$("ccTecnico");cc.value=t?.cc||"";cc.readOnly=v!=="FELIX";cc.placeholder=v==="FELIX"?"Ingrese la C.C. de Félix":"Cédula";$("apoyoNombre").value=t?.apoyo||"";saveDraft()}
function validarEstadoSalud(){const bad=$("estadoSalud").value==="Malo";$("alertaSalud").classList.toggle("show",bad);saveDraft()}
function mostrarCamposEstructura(){["Poste","Torre","Subterraneo"].forEach(x=>$("sec"+x).style.display="none");const v=$("tipoEstructura").value;if(v)$("sec"+v).style.display="block";saveDraft()}
function evaluarOtroAnclaje(){$("divOtroAnclaje").style.display=$("puntoAnclajeSelect").value==="Otro"?"block":"none";saveDraft()}
function setupOther(){["Poste","Torre"].forEach(x=>{const s=$("altura"+x);s.addEventListener("change",()=>{$("divAltura"+x+"Otro").style.display=s.value==="Otro"?"block":"none"})});}
function cargarNovedadTexto(){const s=$("novedadPredefinida");$("observaciones").value=s.value==="OTRO"?"":s.value;saveDraft()}
function limpiarCanvas(id){const c=$(id),ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);saveDraft()}
function resizeCanvas(c){const d=window.devicePixelRatio||1, r=c.getBoundingClientRect();if(!r.width||Math.round(r.width*d)===c.width&&Math.round(r.height*d)===c.height)return;const old=c.toDataURL();c.width=r.width*d;c.height=r.height*d;const ctx=c.getContext("2d");ctx.scale(d,d);if(old!=="data:," ){const img=new Image;img.onload=()=>ctx.drawImage(img,0,0,r.width,r.height);img.src=old}}
function signature(c){let drawing=false,ctx=c.getContext("2d");function pos(e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}function start(e){e.preventDefault();drawing=true;ctx.beginPath();let p=pos(e);ctx.moveTo(p.x,p.y)}function move(e){if(!drawing)return;e.preventDefault();let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()}function end(){if(drawing){drawing=false;saveDraft()}}ctx.lineWidth=2;ctx.lineCap="round";c.addEventListener("pointerdown",start);c.addEventListener("pointermove",move);c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end)}
function draftData(){const o={};document.querySelectorAll("#sdtForm input,#sdtForm select,#sdtForm textarea").forEach(e=>{if(e.type==="radio"){if(e.checked)o[e.name]=e.value}else o[e.id]=e.value});o.sigT=$("canvasTecnico").toDataURL();o.sigA=$("canvasApoyo").toDataURL();return o}
function saveDraft(){try{localStorage.setItem("sdt_alturas_draft",JSON.stringify(draftData()));$("saveState").textContent="Guardado local"}catch(e){}}
function loadDraft(){try{const o=JSON.parse(localStorage.getItem("sdt_alturas_draft")||"{}");Object.entries(o).forEach(([k,v])=>{if(k==="sigT"||k==="sigA")return;let e=$(k);if(e)e.value=v;else{let r=document.querySelector(`input[name="${k}"][value="${v}"]`);if(r)r.checked=true}});configurarTecnico();mostrarCamposEstructura();evaluarOtroAnclaje();validarEstadoSalud();if(o.sigT)loadSig("canvasTecnico",o.sigT);if(o.sigA)loadSig("canvasApoyo",o.sigA)}catch(e){}}
function loadSig(id,data){const c=$(id),img=new Image;img.onload=()=>c.getContext("2d").drawImage(img,0,0,c.width,c.height);img.src=data}
function clearDraft(){localStorage.removeItem("sdt_alturas_draft");$("sdtForm").reset();location.reload()}
function descargarPDF(){if(!$("sdtForm").reportValidity())return;const t=document.title,p=($("proyecto").value||"").trim().replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g,"_").slice(0,40);document.title="Formato_Alturas_SDT_"+($("fecha").value||"")+(p?"_"+p:"");const back=()=>{document.title=t;window.removeEventListener("afterprint",back)};window.addEventListener("afterprint",back);window.print()}
window.addEventListener("resize",()=>document.querySelectorAll(".signature-pad").forEach(resizeCanvas));
document.addEventListener("DOMContentLoaded",()=>{setupOther();document.querySelectorAll(".signature-pad").forEach(c=>{resizeCanvas(c);signature(c)});loadDraft();document.querySelectorAll("#sdtForm input,#sdtForm select,#sdtForm textarea").forEach(e=>e.addEventListener("input",saveDraft));$("fecha").value ||= new Date().toISOString().slice(0,10)});

async function scan(f,k){if(!f)return'';if(!('BarcodeDetector'in window)){toast('Este navegador no lee códigos; escríbelo a mano.');return''}try{const r=await new BarcodeDetector().detect(await createImageBitmap(f)),mac=x=>/^([0-9a-f]{2}[:-]?){5}[0-9a-f]{2}$/i.test(x.rawValue.trim());if(r.length)return(r.find(x=>k==='mac'?mac(x):!mac(x))||r[0]).rawValue.trim();toast('No se detectó un código. Acércate y enfoca mejor.')}catch(e){toast('No se pudo leer el código.')}return''}

function matBox(){const m=cur.mats,ls=MAT[cur.servicio]||[],tot=UN.map(u=>[u,m.filter(x=>(x.u||'unidades')===u).reduce((s,x)=>s+(+x.c||0),0)]).filter(x=>x[1]).map(x=>x[1]+' '+x[0]).join(' · ');return `<div class="card"><h2>🧱 Materiales utilizados</h2><label>Agregar frecuente (${esc(cur.servicio||'Otro')})</label><div class="th">${ls.map(n=>`<button class="tag" data-ma="${esc(n)}">+ ${esc(n)}</button>`).join('')}<button class="tag" data-ma="">+ Otro</button></div>${m.map((x,i)=>`<div class="eq"><div class="row"><b>${esc(x.n)||'Material'}</b><button class="tag" data-md="${i}">🗑 Quitar</button></div><label>Nombre</label><input data-mt="${i}|n" value="${esc(x.n)}"><div class="row"><div><label>Cantidad</label><input type="number" inputmode="decimal" data-mt="${i}|c" value="${esc(x.c)}"></div><div><label>Unidad</label><select data-mt="${i}|u">${UN.map(o=>`<option${x.u===o?' selected':''}>${o}</option>`).join('')}</select></div></div>${refF(x,i)}<label>Observaciones</label><input data-mt="${i}|o" value="${esc(x.o)}"></div>`).join('')}<p class="mu">Total: ${m.length} ítems${tot?' · '+tot:''}</p></div>`}

const v=o.querySelector('video'),stop=()=>{stream&&stream.getTracks().forEach(t=>t.stop());stream=null;o.remove()};o.querySelector('button').onclick=stop;
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play()}catch(e){stop();toast('No se pudo abrir la cámara (permiso denegado o bloqueado). Usa el 📷 de cada campo.');return}
const bd=new BarcodeDetector();(async function loop(){if(!stream)return;try{const r=await bd.detect(v);if(r.length){stop();addScan(r.map(x=>x.rawValue));return}}catch(e){}setTimeout(loop,250)})()}
function addScan(vals){const q={mov:'Instalado'},M=/([0-9a-f]{2}[:-]?){5}[0-9a-f]{2}/i;
vals.forEach(raw=>{const s=raw.trim(),m=s.match(M),n=s.match(/(?:s\/?n|serial)[\s:=#-]*([A-Za-z0-9-]{4,})/i);
if(/^https?:\/\//i.test(s))q.obs='Enlace en el código: '+s;
else if(m&&!n&&s.replace(M,'').replace(/mac|[\s:=-]/gi,'')==='')q.mac=m[0];
else{if(n)q.sn=n[1];if(m&&/mac/i.test(s))q.mac=m[0];if(!n&&!m&&/^[A-Za-z0-9-]{5,}$/.test(s))q.sn=s}});
const L=cur.eq.lista,i=L.findIndex(x=>(q.sn&&x.sn===q.sn)||(q.mac&&x.mac&&x.mac.toLowerCase()===q.mac.toLowerCase()));
if(i>=0)return toast('⚠️ Posible duplicado: ya está registrado como Equipo '+(i+1));

addEventListener('message',function(e){const m=e.data;if(!m||!m.sdtAlt)return;let s=null;try{s=snap()}catch(err){s={error:String(err&&err.message||err)}}parent.postMessage({sdtAlt:m.sdtAlt,snap:s},'*')})}
function altSnap(){return new Promise(res=>{const f=document.getElementById('altf');if(!f||!f.contentWindow)return res(null);const id=String(Math.random());let t;const h=e=>{if(e.data&&e.data.sdtAlt===id){removeEventListener('message',h);clearTimeout(t);res(e.data.snap&&!e.data.snap.error?e.data.snap:null)}};addEventListener('message',h);t=setTimeout(()=>{removeEventListener('message',h);res(null)},4000);f.contentWindow.postMessage({sdtAlt:id},'*')})}
function altView(){return `<div class="np"><button class="tag" data-aback>← Volver</button> <button class="tag" data-aclear>↺ Limpiar formulario</button></div><h1>🦺 Formato de alturas</h1><p class="mu">${altLink?'Vinculado al informe del ticket '+esc(altLink.ticket)+'.':'Formato independiente (sin informe vinculado).'}</p><div class="card" style="padding:0;overflow:hidden"><iframe id="altf" title="Formato de alturas" style="width:100%;height:78vh;border:0;background:#fff"></iframe></div>${altLink?'<button class="btn s" data-asave>💾 Guardar en este informe</button>':''}<button class="btn" data-apdf>⬇️ PDF solo alturas</button>${altLink?'<button class="btn" data-jpdf>⬇️ PDF unido: informe + alturas</button>':''}`}
function loadAlt(){const f=document.getElementById('altf');if(!f)return;let d=null;try{d=altLink?(altLink.alturas&&altLink.alturas.draft):JSON.parse(lsGet('alt_free')||'null')}catch(e){}f.srcdoc=altSrc(d)}
async function altModel(s){const B=JSON.parse(JSON.stringify(s.blocks));for(const b of B)if(b.t==='sig')for(const c of b.cells)if(c.src)c.im=await toJpeg(c.src,900,.92);return{title:'FORMATO DE TRABAJO SEGURO EN ALTURAS',num:'Trabajo en alturas',sub:s.sub||'',band:bandImg(),blocks:B}}

function list(est){const l=acts.filter(a=>a.estado===est);return `<h1>${est==='pendiente'?'📂 Pendientes':'📄 Informes terminados'}</h1><input placeholder="🔍 Buscar por cliente, documento, orden, ticket, fecha o técnico" oninput="for(const c of document.querySelectorAll('.it'))c.hidden=!c.textContent.toLowerCase().includes(this.value.toLowerCase())">`+(l.length?l.map(a=>`<div class="card it" data-open="${a.id}" data-est="${est}"><b>🎫 ${esc(a.ticket)}</b> · ${esc(a.cliente)}<br><span class="mu">${esc(a.tipo)} · ${esc(a.inicio)}</span><span hidden>${esc([a.documento,a.orden,a.tecnico,a.num].join(' '))}</span></div>`).join(''):'<p class="mu">No hay registros.</p>')}
function editor(){const a=cur;return `<h1>🎫 ${esc(a.ticket)}</h1><div class="card"><b>${esc(a.cliente)}</b><br><span class="mu">${esc(a.tipo)} · ${esc(a.direccion)}<br>Inicio: ${esc(a.inicio)}</span></div>
<div class="card"><h2>📸 Evidencias</h2>${photoBox('fotos.antes','Antes')}${photoBox('fotos.durante','Durante')}${photoBox('fotos.final','Final')}</div>
<button class="tag" data-ao>🦺 Formato de alturas</button> <button class="tag" data-jump>⬇️ Ir a encuesta, firmas y cierre</button>${catBox()}${prBox()}${trabBox()}${matBox()}${eqBox()}<div class="card"><h2>🧰 Herramientas</h2>${huBtns()}${(a.herrUso||'Sí')==='No'?'<p class="mu">No se utilizaron herramientas.</p>':HERR.map((h,i)=>`<label class="chk"><input type="checkbox" data-h="${i}" ${a.herr[i]?'checked':''}>${h}</label>`).join('')}${(a.herrUso||'Sí')==='No'?'':`<label class="chk" style="border:0;font-weight:600"><input type="checkbox" data-verif ${a.verif?'checked':''}>Verifiqué herramientas y EPP</label>`}</div>
<div id="cierre"></div>${svBox()}${fiBox()}<button class="btn ok" data-fin>✅ Terminar actividad</button><button class="btn s" data-v="pend">Guardar y volver</button><button class="btn d" data-rm>Eliminar actividad</button>`}
function form(){return `<h1>➕ Nueva actividad</h1><div class="card" id="f"><label>Ticket *</label><input name="ticket" required inputmode="numeric"><label>Cliente *</label><input name="cliente" required><label>Documento</label><input name="documento"><label>Dirección</label><input name="direccion"><label>Teléfono</label><input name="telefono" type="tel"><label>Tipo de actividad</label><select name="tipo">${TIPOS.map(t=>`<option>${t}</option>`).join('')}</select><label>Municipio</label><input name="municipio"><label>Departamento</label><input name="depto"><label>Tipo de servicio</label><select name="servicio"><option>Fibra óptica</option><option>Radioenlace</option><option>Otro</option></select><label>Empresa contratante</label><input name="empresa" value="SDT INGENIERÍA" readonly><label>Técnico</label><input name="tecnico" value="${esc(lsGet('tec'))}"><label>Fecha/hora (automática)</label><input value="${now()}" disabled><button type="button" class="btn" data-crear>Crear y continuar</button></div>`}
function render(){const _y=scrollY;if(cur){cur.eq=cur.eq||{cambia:'No',lista:[]};cur.trab=cur.trab||{};cur.mats=cur.mats||[];cur.cat=cur.cat||{};CATS.forEach(([k])=>cur.cat[k]=cur.cat[k]||[]);cur.pr=cur.pr||{};cur.sv=cur.sv||{};cur.fi=cur.fi||{cli:{},tec:{}}}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view||(view==='edit'&&b.dataset.v==='pend')||(view==='rep'&&b.dataset.v==='done')));
$('#app').innerHTML=view==='home'?`<h1 style="display:flex;align-items:center;gap:10px"><img src="${ICON}" alt="" style="height:40px;width:auto;border-radius:8px;flex:none">SDT Ingeniería</h1>${dash()}<h2 style="margin-top:16px">Informes</h2><div class="pills"><button class="pill" data-pf="v|pend"><b style="background:#7a5af8">${acts.filter(a=>a.estado==='pendiente').length}</b>Pendientes</button><button class="pill" data-pf="v|done"><b style="background:#667085">${acts.filter(a=>a.estado==='terminada').length}</b>Terminadas</button></div><button class="btn" data-v="new">➕ Nueva actividad</button><button class="btn s" data-v="pend">📂 Pendientes</button><button class="btn s" data-v="done">📄 Informes terminados</button><div class="card" style="margin-top:14px"><h2>⚙️ Logo del informe</h2><img src="${lsGet('logo')||LOGO}" style="width:60%;background:#fff;padding:6px;border-radius:8px"><br><label class="add" style="margin-top:8px">Cambiar logo<input type="file" accept="image/*" data-logo></label> <button class="tag" data-lr>Restaurar logo SDT</button></div>`:view==='tix'?tixView():view==='alt'?altView():view==='tk'?tkView():view==='new'?form():view==='pend'?list('pendiente'):view==='done'?list('terminada'):view==='edit'?editor():report();scrollTo(0,lastV===view?_y:0);lastV=view;initCv();fq();if(view==='alt')loadAlt()}
const go=(v,a)=>{view=v;if(a!==undefined)cur=a;render()};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-v],[data-open],[data-del],[data-fin],[data-rm],[data-eqs],[data-eqd],[data-eqa],[data-live],[data-ma],[data-md],[data-st],[data-yn],[data-sc],[data-nf],[data-cl],[data-ok],[data-lr],[data-cor],[data-tk],[data-te],[data-oi],[data-bk],[data-jump],[data-dt],[data-hu],[data-pdf],[data-pf],[data-ao],[data-ao0],[data-aback],[data-asave],[data-aclear],[data-apdf],[data-jpdf],[data-crear]');if(!t)return;const d=t.dataset;if(d.pf){const[k,v]=d.pf.split('|');if(k==='v')return go(v);FQ={q:'',m:'',e:'',a:''};FQ[k]=v;return go('tix')}
if(d.eqs){cur.eq.cambia=d.eqs;if(d.eqs==='Sí'&&!cur.eq.lista.length)cur.eq.lista.push({mov:'Instalado'});await save(cur);return render()}
if(d.eqd!==undefined){cur.eq.lista.splice(+d.eqd,1);await save(cur);return render()}
if(t.hasAttribute('data-eqa')){cur.eq.lista.push({mov:'Instalado'});await save(cur);return render()}
if(t.hasAttribute('data-live'))return live();
if(d.st){const[k,n]=d.st.split('|');cur.sv[k]=+n;await save(cur);return render()}
if(d.yn){const[k,o]=d.yn.split('|');cur.sv[k]=o;await save(cur);return render()}
if(d.sc){cur.fi[d.sc]={nombre:cur.fi[d.sc].nombre};await save(cur);return render()}
if(d.nf){cur.fi[d.nf].motivo='';await save(cur);return render()}
if(d.tk){ct=TX.find(x=>x.n===d.tk);return go('tk')}
if(d.te){ct.estado=d.te;svTx();return render()}
if(t.hasAttribute('data-oi')){let ac=acts.find(x=>x.id===ct.actId);if(!ac){ac=Object.assign(mk(),{ticket:ct.n,cliente:ct.desc.replace(/\s*\(\d+\)\s*$/,''),municipio:ct.muni+(ct.depto?', '+ct.depto:''),documento:'',direccion:'',telefono:'',tipo:TIPOS[0],tecnico:lsGet('tec'),servicio:'Fibra óptica',inicio:now()});acts.unshift(ac);ct.actId=ac.id;await save(ac)}if(ct.estado==='Pendiente')ct.estado='En proceso';svTx();return go(ac.estado==='terminada'?'rep':'edit',ac)}
if(t.hasAttribute('data-bk')){await saveFile('sdt-respaldo-'+td()+'.json',new Blob([JSON.stringify({v:1,fecha:now(),tix:TX,acts})],{type:'application/json'}));return toast('Copia guardada. Contiene datos de clientes: guárdala en privado.')}
if(t.hasAttribute('data-jump')){$('#cierre').scrollIntoView({behavior:'smooth'});return}
if(t.hasAttribute('data-dt')){if(armed!==ct.n){armed=ct.n;setTimeout(()=>armed='',4000);return toast('Toca otra vez «Eliminar ticket» para borrarlo (su informe no se borra).')}TX=TX.filter(x=>x!==ct);svTx();return go('tix')}
if(d.hu){cur.herrUso=d.hu;await save(cur);return render()}
if(t.hasAttribute('data-crear')){const o={};document.querySelectorAll('#f [name]').forEach(x=>o[x.name]=String(x.value||'').trim());if(!o.ticket||!o.cliente)return toast('Escribe el ticket y el cliente para continuar.');const a=Object.assign(mk(),o);a.inicio=now();a.num='SDT-'+String(+lsGet('cons')+1).padStart(4,'0');lsSet('cons',+lsGet('cons')+1);lsSet('tec',a.tecnico);acts.unshift(a);await save(a);return go('edit',a)}
if(t.hasAttribute('data-ao')){altLink=cur;return go('alt')}
if(t.hasAttribute('data-ao0')){altLink=null;return go('alt')}
if(t.hasAttribute('data-aback')){const sn=await altSnap(),l=altLink;if(sn){if(l){l.alturas=sn;await save(l)}else lsSet('alt_free',JSON.stringify(sn.draft))}if(l)return go(l.estado==='terminada'?'rep':'edit',l);return go('home')}
if(t.hasAttribute('data-asave')){const sn=await altSnap();if(!sn)return toast('No pude leer el formato de alturas. Espera a que cargue y vuelve a intentar.');altLink.alturas=sn;await save(altLink);return toast('Formato de alturas guardado en este informe')}
if(t.hasAttribute('data-aclear')){if(altLink){delete altLink.alturas;await save(altLink)}else lsSet('alt_free','');document.getElementById('altf').srcdoc=altSrc(null);return toast('Formulario limpio')}
if(t.hasAttribute('data-apdf'))return makePdf('alt');
if(t.hasAttribute('data-jpdf'))return makePdf('join');
if(t.hasAttribute('data-pdf'))return makePdf('inf');
if(d.cl)return render();
if(t.hasAttribute('data-lr')){try{localStorage.removeItem('logo')}catch(e){}return render()}
if(t.hasAttribute('data-cor')){const m=$('#cm').value.trim();if(!m)return toast('Escribe el motivo de la corrección.');cur.hist=(cur.hist||[]).concat({f:now(),m});cur.ver=(cur.ver||1)+1;cur.estado='pendiente';await save(cur);return go('edit')}
if(d.ok){const c=document.querySelector(`canvas[data-cv="${d.ok}"]`);if(!c.dataset.d)return toast('Dibuja la firma primero.');const f=cur.fi[d.ok];f.img=c.toDataURL('image/png');f.fecha=now();await save(cur);return render()}
if(d.ma!==undefined){cur.mats.push({n:d.ma,u:'unidades'});await save(cur);return render()}
if(d.md!==undefined){cur.mats.splice(+d.md,1);await save(cur);return render()}
if(d.v)return go(d.v);
if(d.open)return go(d.est==='pendiente'?'edit':'rep',acts.find(a=>a.id===d.open));
if(d.del){const[p,i]=d.del.split('|');arr(cur,p).splice(+i,1);await save(cur);return render()}
if(t.hasAttribute('data-fin')){cur.estado='terminada';cur.fin=now();await save(cur);return go('rep')}
if(t.hasAttribute('data-rm')){if(armed!==cur.id){armed=cur.id;setTimeout(()=>armed='',4000);return toast('Toca otra vez «Eliminar» para borrar este informe.')}acts=acts.filter(a=>a!==cur);TX.forEach(x=>{if(x.actId===cur.id)delete x.actId});svTx();if(db)await tx('readwrite',s=>s.delete(cur.id));go('done')}});
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset;
if(d.ph){try{const e=await navigator.storage.estimate();if(e.quota-e.usage<30e6)toast('⚠️ Queda poco espacio ('+Math.round((e.quota-e.usage)/1e6)+' MB). Haz copia de seguridad y libera espacio.')}catch(x){}for(const f of t.files)arr(cur,d.ph).push({s:await shrink(f),d:'',t:new Date(f.lastModified||Date.now()).toLocaleString('es-CO')});await save(cur);render()}
else if(d.eq){const[i,k]=d.eq.split('|');cur.eq.lista[i][k]=t.value;save(cur)}
else if(d.tr){cur.trab[d.tr]=t.value;save(cur)}
else if(d.mt){const[i,k]=d.mt.split('|'),m=cur.mats[i];m[k]=t.value;if(k==='n'){m.r='';m.rt=''}save(cur);if(k==='n'||k==='r')render()}
else if('ef'in d){cur.estadoFinal=t.value;save(cur)}
else if(d.dd){const[p,k]=d.dd.split('|');arr(cur,p)[k]=t.value;if(p==='trab'&&k==='problema'){cur.trab.solucion='';delete cur.trab.solucion_t}save(cur);render()}
else if(d.ac){const a=cur.trab.act=cur.trab.act||[];if(t.checked){if(!a.includes(d.ac))a.push(d.ac)}else if(a.includes(d.ac))a.splice(a.indexOf(d.ac),1);save(cur);render()}
else if(d.fl){FQ[d.fl]=t.value;render()}
else if('csv'in d){const f=t.files[0];if(!f)return;try{const buf=await f.arrayBuffer();let s;try{s=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){s=new TextDecoder('windows-1252').decode(buf)}const[a,b,c]=mergeTix(csvToTix(s));render();toast(`Importado: ${a} nuevos, ${b} actualizados, ${c} sin aparecer`)}catch(e){toast('No se pudo importar: '+e.message)}t.value=''}
else if('rs'in d){const f=t.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.tix)||!Array.isArray(j.acts))throw Error('archivo no válido');for(const x of j.tix){const y=TX.find(z=>z.n===x.n);y?Object.assign(y,x):TX.push(x)}for(const x of j.acts){const i=acts.findIndex(z=>z.id===x.id);i>=0?acts[i]=x:acts.push(x);await save(x)}svTx();acts.sort((p,q)=>q.id.localeCompare(p.id));render();toast('Copia restaurada')}catch(e){toast('No se pudo restaurar: '+e.message)}t.value=''}
else if(d.pd){const[p,i]=d.pd.split('|'),a=arr(cur,p);if(typeof a[i]==='string')a[i]={s:a[i]};a[i].d=t.value;save(cur)}
else if('logo'in d){const f=t.files[0];if(!f)return;if(f.size>800000)return toast('Imagen muy pesada (máx. 800 KB).');const r=new FileReader();r.onload=()=>{lsSet('logo',r.result);render();toast('Logo actualizado')};r.readAsDataURL(f)}
else if(d.g){const[p,k]=d.g.split('|');arr(cur,p)[k]=t.value;save(cur)}
else if(d.scan){const[i,k]=d.scan.split('|'),v=await scan(t.files[0],k);if(v){cur.eq.lista[i][k]=v;await save(cur);render()}}
else if(d.h!==undefined){cur.herr[d.h]=t.checked;save(cur)}else if('verif'in d){cur.verif=t.checked;save(cur)}});

(async()=>{try{db=await openDB();acts=await tx('readonly',s=>s.getAll())||[];acts.sort((a,b)=>b.id.localeCompare(a.id))}catch(e){db=null}render()})();
(function(){const el=document.getElementById('net');if(!el)return;const up=()=>{const on=navigator.onLine;el.className=on?'on':'off';el.innerHTML='<i></i>'+(on?'En línea':'Sin conexión')};addEventListener('online',up);addEventListener('offline',up);up()})();
